<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#547868" stroke-width="1.5"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#234b3e;text-anchor:middle}.box{fill:#fff;stroke:#b5cbbb;stroke-width:2}.line{fill:none;stroke:#547868;stroke-width:2;marker-end:url(#arrow)}.sub{font-size:15px;fill:#667c6c}</style></defs>
<rect width="1000" height="760" fill="#f4f7f1"/><text x="500" y="55" font-size="28" font-weight="bold">文章驱动英语学习 · 完整流程</text><text x="500" y="86" class="sub">Vue 前端 → FastAPI 接口 → MySQL 持久化 / 千问角色对话</text>
<g font-size="20"><rect class="box" x="350" y="115" width="300" height="60" rx="12"/><text x="500" y="153">注册 / 登录，获取 JWT</text><path class="line" d="M500 175V205"/>
<rect class="box" x="350" y="210" width="300" height="60" rx="12"/><text x="500" y="248">上传或选择英文文章</text><path class="line" d="M500 270V300"/>
<rect class="box" x="350" y="305" width="300" height="70" rx="12"/><text x="500" y="337">生成或查询场景卡</text><text x="500" y="360" class="sub">角色 · 目标 · 冲突 · 任务链</text><path class="line" d="M500 375V405"/>
<rect class="box" x="350" y="410" width="300" height="60" rx="12"/><text x="500" y="448">创建 / 恢复我的学习会话</text><path class="line" d="M500 470V500"/>
<rect class="box" x="350" y="505" width="300" height="70" rx="12"/><text x="500" y="536">发送英文消息 → 千问回复</text><text x="500" y="560" class="sub">消息落库，读取最近 10 条上下文</text><path class="line" d="M500 575V605"/>
<rect class="box" x="350" y="610" width="300" height="70" rx="12"/><text x="500" y="641">查看并导出学习报告</text><text x="500" y="665" class="sub">发言统计 · 表达回顾 · 提示复习</text></g>
<path class="line" d="M650 540H740V440H655"/><text x="813" y="495" class="sub">继续多轮练习</text><path class="line" d="M650 340H820"/><rect class="box" x="825" y="310" width="155" height="60" rx="10"/><text x="902" y="338" font-size="16">千问 JSON 校验</text><text x="902" y="360" class="sub">不合格重试一次</text>
<rect x="30" y="410" width="270" height="165" rx="12" fill="#e4eee2"/><text x="165" y="445" font-size="18">用户隔离</text><text x="165" y="478" class="sub">会话、消息、报告均验证 user_id</text><text x="165" y="508" class="sub">访问他人记录返回 404</text><text x="165" y="538" class="sub">文章与场景对登录用户共享</text><text x="500" y="725" class="sub">报告基于真实记录统计，不将词数等同于熟练度或语法分数。</text></svg>
