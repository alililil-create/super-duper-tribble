[project]
name = "learn-assistant-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<2.1", "asyncmy>=0.2,<1", "cryptography>=43", "pydantic-settings>=2,<3", "email-validator>=2,<3", "bcrypt>=4,<6", "PyJWT>=2.9,<3", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "aiosqlite>=0.20,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
